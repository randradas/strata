[project]
name = "strata-sdd"
version = "0.4.2"
description = "strata: layered specs and context for AI coding agents."
readme = "README.md"
license = "MIT"
license-files = [
    "LICENSE",
    "LICENSE-GENERATED.md",
    "src/strata_sdd/templates/base/dot-claude/skills/grill/LICENSE-mattpocock-skills.md",
]
authors = [
    { name = "Roberto Andradas Izquierdo", email = "randradas@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
strata = "strata_sdd.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
